services:
  api:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      HARNESS_OS_MODE: ${HARNESS_OS_MODE:-demo}
      HARNESS_OS_DB: /data/harness_os.db
      HARNESS_OS_CORS_ORIGINS: ${HARNESS_OS_CORS_ORIGINS:-http://localhost:5173}
      TRUEFORGE_BASE_URL: ${TRUEFORGE_BASE_URL:-http://host.docker.internal:8790}
      TRUEFORGE_TOKEN: ${TRUEFORGE_TOKEN:-}
      TRUEFORGE_REQUEST_TIMEOUT_SECONDS: ${TRUEFORGE_REQUEST_TIMEOUT_SECONDS:-60}
      TRUEFORGE_PROBE_TIMEOUT_SECONDS: ${TRUEFORGE_PROBE_TIMEOUT_SECONDS:-4}
      HARNESS_CHAOS_MCP_URL: ${HARNESS_CHAOS_MCP_URL:-http://mcp-chaos:8940/mcp}
      PUBLIC_REFUND_FIXTURE_URL: ${PUBLIC_REFUND_FIXTURE_URL:-http://customer-fixture:8950/health}
      PUBLIC_FAULTLINE_HEALTH_URL: ${PUBLIC_FAULTLINE_HEALTH_URL:-http://mcp-chaos:8940/health}
    volumes: ["harness-data:/data"]
  mcp-chaos:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./mcp-chaos:/app"]
    command: sh -c "npm install && npm start"
    environment:
      FIXTURE_BASE_URL: http://customer-fixture:8950
    depends_on: [customer-fixture]
    ports: ["8940:8940"]
  customer-fixture:
    build: ./backend
    command: uvicorn app.fixture_service:app --host 0.0.0.0 --port 8950
    environment:
      FIXTURE_DB: /data/customer_fixture.db
    volumes: ["fixture-data:/data"]
    ports: ["8950:8950"]
volumes:
  harness-data:
  fixture-data:
