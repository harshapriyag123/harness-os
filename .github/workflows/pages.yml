name: Deploy public judge views

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build existing read-only root console
        working-directory: frontend
        env:
          VITE_PUBLIC_READ_ONLY: 'true'
          VITE_BASE_PATH: '/harness-os/'
        run: npm run build

      - name: Stage root console
        run: |
          rm -rf /tmp/harness-pages
          mkdir -p /tmp/harness-pages
          cp -R frontend/dist/. /tmp/harness-pages/

      - name: Build full Mission Control judge demo
        working-directory: frontend
        env:
          VITE_PUBLIC_READ_ONLY: 'false'
          VITE_HOSTED_JUDGE: 'true'
          VITE_API_URL: 'https://harness-os-api-cloud.onrender.com'
          VITE_BASE_PATH: '/harness-os/judge-demo/'
        run: npm run build

      - name: Stage full judge demo under dedicated path
        run: |
          mkdir -p /tmp/harness-pages/judge-demo
          cp -R frontend/dist/. /tmp/harness-pages/judge-demo/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/harness-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
