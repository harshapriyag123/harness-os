<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Harness OS TrueForge Agent Library</title><desc id="d">Declarative view of the Harness OS TrueForge agent, delegated subagents and skills committed in the repository.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0c2034"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="80" fill="#77e7d3" font-family="Inter,Arial" font-size="26" font-weight="800" letter-spacing="4">TRUEFORGE · DECLARATIVE AGENT LIBRARY</text><text x="80" y="145" fill="#f4f8ff" font-family="Inter,Arial" font-size="48" font-weight="900">Harness OS agents and runtime instructions</text><text x="80" y="190" fill="#92a9c4" font-family="Inter,Arial" font-size="22">Source of truth: trueforge/agents/harness-os + trueforge/skills</text><g font-family="Inter,Arial"><rect x="80" y="245" width="620" height="250" rx="28" fill="#0d1c2e" stroke="#51dec3" stroke-width="3"/><text x="120" y="295" fill="#51dec3" font-size="22" font-weight="800">PRIMARY AGENT</text><text x="120" y="350" fill="#fff" font-size="42" font-weight="900">harness-os</text><text x="120" y="390" fill="#c5d4e8" font-size="24">Autonomous Agent Reliability Engineer</text><text x="120" y="435" fill="#90a8c2" font-size="20">DISCOVER → MODEL → ATTACK → PROVE → REPAIR → VERIFY</text><text x="120" y="468" fill="#90a8c2" font-size="20">→ HUMAN APPROVAL → ACT → RE-ATTACK → SAFETY CASE</text><rect x="750" y="245" width="770" height="250" rx="28" fill="#0d1c2e" stroke="#6d7eff" stroke-width="3"/><text x="790" y="295" fill="#8ea0ff" font-size="22" font-weight="800">DELEGATED SUBAGENTS</text><g fill="#eef3ff" font-size="27" font-weight="800"><text x="790" y="350">Discovery Agent</text><text x="1160" y="350">Reliability Agent</text><text x="790" y="415">Evidence Judge</text><text x="1160" y="415">Remediation Agent</text></g><g fill="#92a9c4" font-size="18"><text x="790" y="378">repository/tool discovery</text><text x="1160" y="378">H-005 adversarial testing</text><text x="790" y="443">evidence sufficiency</text><text x="1160" y="443">smallest safe repair</text></g><rect x="80" y="545" width="1440" height="250" rx="28" fill="#0b1828" stroke="#2e4b69" stroke-width="2"/><text x="120" y="595" fill="#77c8ff" font-size="22" font-weight="800">GIT-BACKED SKILLS</text><g font-size="23" fill="#f1f6ff" font-weight="700"><text x="120" y="650">harness-discovery</text><text x="430" y="650">safety-contract</text><text x="710" y="650">scenario-synthesis</text><text x="1030" y="650">reliability-testing</text><text x="120" y="715">evidence-verification</text><text x="430" y="715">root-cause</text><text x="710" y="715">remediation</text><text x="1030" y="715">safety-case</text></g><text x="120" y="770" fill="#91a7c1" font-size="19">Non-negotiable: real MCP evidence · sandbox generated code · pause before irreversible writes · never fabricate approvals, PRs, Qodo or Safety Case evidence</text></g></svg>