<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0d2138"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#79c2ff"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="90" y="100" fill="#79c2ff" font-family="Inter,Arial" font-size="28" font-weight="800" letter-spacing="4">HARNESS OS · TRUEFORGE-CENTRIC ARCHITECTURE</text><text x="90" y="165" fill="#edf6ff" font-family="Inter,Arial" font-size="54" font-weight="900">TrueForge is the harness. Harness OS is the operator control plane.</text><g font-family="Inter,Arial" text-anchor="middle"><g fill="#0b1a2b" stroke="#315779" stroke-width="3"><rect x="80" y="330" width="250" height="190" rx="28"/><rect x="400" y="280" width="300" height="290" rx="30"/><rect x="780" y="330" width="250" height="190" rx="28"/><rect x="1100" y="330" width="220" height="190" rx="28"/><rect x="1380" y="330" width="150" height="190" rx="28"/></g><text x="205" y="395" fill="#7ec8ff" font-size="25" font-weight="800">MODEL</text><text x="205" y="445" fill="#fff" font-size="34" font-weight="900">Ollama</text><text x="205" y="482" fill="#91a7c1" font-size="20">or hosted LLM</text><text x="550" y="360" fill="#9b8cff" font-size="25" font-weight="800">AGENT HARNESS</text><text x="550" y="425" fill="#fff" font-size="46" font-weight="900">TrueForge</text><text x="550" y="470" fill="#aab5d8" font-size="20">agent loop · MCP orchestration</text><text x="550" y="505" fill="#aab5d8" font-size="20">sandbox · approvals · session state</text><text x="905" y="395" fill="#7ec8ff" font-size="25" font-weight="800">TOOLS</text><text x="905" y="440" fill="#fff" font-size="30" font-weight="900">GitHub + FaultLine</text><text x="905" y="482" fill="#91a7c1" font-size="20">real external actions</text><text x="1210" y="395" fill="#7ec8ff" font-size="25" font-weight="800">CONTROL PLANE</text><text x="1210" y="440" fill="#fff" font-size="30" font-weight="900">Harness OS</text><text x="1210" y="482" fill="#91a7c1" font-size="20">evidence · gates · UI</text><text x="1455" y="395" fill="#7de7b5" font-size="25" font-weight="800">BRAKE</text><text x="1455" y="440" fill="#fff" font-size="30" font-weight="900">Human</text><text x="1455" y="482" fill="#9fd8c0" font-size="20">approve</text><g stroke="#79c2ff" stroke-width="5" marker-end="url(#a)"><line x1="330" y1="425" x2="390" y2="425"/><line x1="700" y1="425" x2="770" y2="425"/><line x1="1030" y1="425" x2="1090" y2="425"/><line x1="1320" y1="425" x2="1370" y2="425"/></g></g><g font-family="Inter,Arial"><text x="100" y="675" fill="#eaf2ff" font-size="30" font-weight="800">Golden path</text><text x="100" y="730" fill="#a9bdd5" font-size="24">DISCOVER → ATTACK → PROVE → REPAIR → VERIFY → HUMAN APPROVAL → GitHub PR → Qodo → REPLAY → SAFETY CASE</text><text x="100" y="800" fill="#738eac" font-size="20">Remove TrueForge and the agent loop, tool orchestration, sandbox boundary and approval pause disappear.</text></g></svg>