<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Harness OS Local Mission Control</title><desc id="d">High fidelity representation of the running local operator console based on the captured Mission Control screen.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1f33"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="72" y="72" fill="#66e0cb" font-family="Inter,Arial" font-size="24" font-weight="800" letter-spacing="4">HARNESS OS · LOCAL OPERATOR CONSOLE</text><text x="72" y="125" fill="#fff" font-family="Inter,Arial" font-size="42" font-weight="900">One target. One evidence chain. Human control before irreversible writes.</text><g font-family="Inter,Arial"><rect x="72" y="170" width="1456" height="190" rx="24" fill="#0c1a2a" stroke="#2a526f" stroke-width="2"/><text x="105" y="215" fill="#7dcdfd" font-size="19" font-weight="800">TARGET WORKSPACE</text><text x="105" y="260" fill="#fff" font-size="32" font-weight="900">harness-os · main</text><text x="105" y="298" fill="#93a9c2" font-size="18">GitHub repository connected · public fixture + FaultLine bridge</text><rect x="105" y="315" width="210" height="36" rx="18" fill="#18463f"/><text x="210" y="340" text-anchor="middle" fill="#8df4cf" font-size="17" font-weight="800">INSPECT WITH TRUEFORGE</text><rect x="890" y="205" width="280" height="110" rx="18" fill="#0a1725" stroke="#244b68"/><text x="915" y="240" fill="#98adc3" font-size="16">REFUND FIXTURE</text><text x="915" y="275" fill="#8df4cf" font-size="22" font-weight="800">ONLINE</text><rect x="1190" y="205" width="290" height="110" rx="18" fill="#0a1725" stroke="#244b68"/><text x="1215" y="240" fill="#98adc3" font-size="16">FAULTLINE MCP</text><text x="1215" y="275" fill="#8df4cf" font-size="22" font-weight="800">CONNECTED</text><rect x="72" y="395" width="1456" height="180" rx="24" fill="#0c1a2a" stroke="#2a526f" stroke-width="2"/><text x="105" y="438" fill="#7dcdfd" font-size="19" font-weight="800">LIVE ASSURANCE STACK</text><text x="105" y="475" fill="#fff" font-size="26" font-weight="900">TrueForge → FaultLine MCP → GitHub MCP → Qodo Review → Safety Case</text><g font-size="17" font-weight="800"><rect x="105" y="510" width="230" height="42" rx="12" fill="#183b35"/><text x="220" y="537" text-anchor="middle" fill="#8df4cf">TRUEFORGE</text><rect x="350" y="510" width="230" height="42" rx="12" fill="#183b35"/><text x="465" y="537" text-anchor="middle" fill="#8df4cf">FAULTLINE MCP</text><rect x="595" y="510" width="230" height="42" rx="12" fill="#3a321a"/><text x="710" y="537" text-anchor="middle" fill="#ffd879">GITHUB MCP</text><rect x="840" y="510" width="230" height="42" rx="12" fill="#183b35"/><text x="955" y="537" text-anchor="middle" fill="#8df4cf">QODO</text><rect x="1085" y="510" width="230" height="42" rx="12" fill="#26354a"/><text x="1200" y="537" text-anchor="middle" fill="#a9c9e8">SAFETY CASE</text></g><rect x="72" y="610" width="1456" height="220" rx="24" fill="#0c1a2a" stroke="#2a526f" stroke-width="2"/><text x="105" y="653" fill="#66e0cb" font-size="19" font-weight="800">LIVE AGENT OPERATOR CONSOLE</text><text x="105" y="695" fill="#fff" font-size="30" font-weight="900">What it is doing · what it is waiting on · what it did</text><g><rect x="105" y="725" width="420" height="75" rx="16" fill="#091522"/><text x="130" y="753" fill="#8da6c0" font-size="15">WHAT IT'S DOING</text><text x="130" y="782" fill="#fff" font-size="21" font-weight="800">TrueForge runtime execution</text><rect x="545" y="725" width="420" height="75" rx="16" fill="#091522"/><text x="570" y="753" fill="#8da6c0" font-size="15">WHAT IT'S WAITING ON</text><text x="570" y="782" fill="#fff" font-size="21" font-weight="800">Evidence or approval gate</text><rect x="985" y="725" width="500" height="75" rx="16" fill="#091522"/><text x="1010" y="753" fill="#8da6c0" font-size="15">WHAT IT DID</text><text x="1010" y="782" fill="#fff" font-size="21" font-weight="800">Persisted causal trace</text></g></g></svg>