<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Harness OS Mission Control</title><desc id="desc">Judge-facing visualization of the Harness OS operator console showing TrueForge, public services, H-005 evidence, causal trace, and approval gates.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111d"/><stop offset="1" stop-color="#0b1f34"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="70" y="72" fill="#eaf4ff" font-size="34" font-weight="800">Harness OS</text><text x="70" y="106" fill="#7f9bb8" font-size="18">Agent Safety Mission Control</text><rect x="1230" y="52" width="150" height="44" rx="22" fill="#0d2a27" stroke="#2f826f"/><circle cx="1256" cy="74" r="6" fill="#55e3b6"/><text x="1274" y="80" fill="#b9ffe9" font-size="16" font-weight="700">TrueForge LIVE</text><rect x="1395" y="52" width="130" height="44" rx="22" fill="#102338" stroke="#345775"/><text x="1420" y="80" fill="#c8d9ea" font-size="16">2/2 public</text><line x1="60" y1="128" x2="1540" y2="128" stroke="#1f3a53"/><text x="70" y="172" fill="#6886a6" font-size="14" font-weight="800" letter-spacing="2">ACTIVE TARGET</text><text x="70" y="208" fill="#ffffff" font-size="24" font-weight="800">harness-os · main</text><text x="70" y="238" fill="#77bffc" font-size="15">github.com/harshapriyag123/harness-os</text><rect x="1250" y="168" width="260" height="54" rx="12" fill="#1d78b6"/><text x="1300" y="202" fill="#fff" font-size="18" font-weight="800">Inspect with TrueForge</text><g><rect x="70" y="285" width="460" height="145" rx="18" fill="#0a1928" stroke="#1e3e59"/><text x="95" y="320" fill="#7292b0" font-size="13" font-weight="800">WHAT IT'S DOING</text><text x="95" y="360" fill="#fff" font-size="24" font-weight="800">Proving H-005</text><text x="95" y="395" fill="#8ea7bf" font-size="16">TrueForge → FaultLine → fixture evidence</text><rect x="570" y="285" width="460" height="145" rx="18" fill="#0a1928" stroke="#1e3e59"/><text x="595" y="320" fill="#7292b0" font-size="13" font-weight="800">WHAT IT'S WAITING ON</text><text x="595" y="360" fill="#fff" font-size="24" font-weight="800">Human approval</text><text x="595" y="395" fill="#8ea7bf" font-size="16">Consequential GitHub write remains paused</text><rect x="1070" y="285" width="460" height="145" rx="18" fill="#0a1928" stroke="#1e3e59"/><text x="1095" y="320" fill="#7292b0" font-size="13" font-weight="800">WHAT IT DID</text><text x="1095" y="360" fill="#ff8793" font-size="24" font-weight="800">H-005 FAIL · CRITICAL</text><text x="1095" y="395" fill="#8ea7bf" font-size="16">2 committed refunds · 49,800¢</text></g><rect x="70" y="468" width="1460" height="185" rx="20" fill="#091625" stroke="#23435f"/><text x="95" y="507" fill="#70bfff" font-size="14" font-weight="800" letter-spacing="2">H-005 EVIDENCE</text><text x="95" y="555" fill="#fff" font-size="36" font-weight="900">$249 expected  →  $498 observed</text><text x="95" y="595" fill="#9bb1c7" font-size="18">remote success → response lost → caller timeout → repeated non-idempotent execution → second committed refund</text><rect x="1210" y="510" width="280" height="95" rx="16" fill="#2a1219" stroke="#8d394b"/><text x="1240" y="548" fill="#ff9eaa" font-size="15" font-weight="800">VERDICT</text><text x="1240" y="586" fill="#fff" font-size="28" font-weight="900">CONFIRMED</text><text x="95" y="708" fill="#70bfff" font-size="14" font-weight="800" letter-spacing="2">CAUSAL FLIGHT RECORDER</text><g font-size="15"><rect x="70" y="735" width="210" height="86" rx="14" fill="#0c1e30" stroke="#294c68"/><text x="95" y="770" fill="#fff" font-weight="800">01 refund.create</text><text x="95" y="798" fill="#8ca8c1">$249</text><rect x="315" y="735" width="210" height="86" rx="14" fill="#0c1e30" stroke="#294c68"/><text x="340" y="770" fill="#fff" font-weight="800">02 COMMITTED</text><text x="340" y="798" fill="#8ca8c1">remote SUCCESS</text><rect x="560" y="735" width="210" height="86" rx="14" fill="#0c1e30" stroke="#294c68"/><text x="585" y="770" fill="#fff" font-weight="800">03 TIMEOUT</text><text x="585" y="798" fill="#8ca8c1">response lost</text><rect x="805" y="735" width="210" height="86" rx="14" fill="#0c1e30" stroke="#294c68"/><text x="830" y="770" fill="#fff" font-weight="800">04 REPEAT</text><text x="830" y="798" fill="#8ca8c1">no idempotency key</text><rect x="1050" y="735" width="210" height="86" rx="14" fill="#27131a" stroke="#8d394b"/><text x="1075" y="770" fill="#fff" font-weight="800">05 $498</text><text x="1075" y="798" fill="#ff9eaa">2 effects</text><rect x="1295" y="735" width="235" height="86" rx="14" fill="#132519" stroke="#356d47"/><text x="1320" y="770" fill="#fff" font-weight="800">06 HUMAN BRAKE</text><text x="1320" y="798" fill="#9edbb3">approve / reject</text></g></g></svg>