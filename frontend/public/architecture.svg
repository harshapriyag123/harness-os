<path d="M330 320 C370 320 390 320 425 320" class="line"/><path d="M930 300 C970 300 990 300 1025 300" class="line"/><path d="M1225 445 L1225 495" class="line"/><path d="M680 620 L680 695" class="line"/><path d="M1225 670 C1225 735 1165 760 1205 760" class="dash"/><text x="960" y="748" class="muted s">persisted evidence</text>

