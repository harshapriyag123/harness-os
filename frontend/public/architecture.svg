<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc"><title id="title">Harness OS TrueForge Architecture</title><desc id="desc">Architecture showing model providers feeding TrueForge, which orchestrates subagents, sandbox, deferred MCP tools, approval and evidence for Harness OS.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081625"/><stop offset="1" stop-color="#030912"/></linearGradient><linearGradient id="tf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c4f78"/><stop offset="1" stop-color="#122942"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#67b9ff"/></marker><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eaf3ff}.muted{fill:#93a9c4}.eyebrow{fill:#6dc0ff;font-size:15px;font-weight:800;letter-spacing:2px}.h{font-size:28px;font-weight:800}.b{font-size:18px;font-weight:700}.s{font-size:14px}.box{fill:#091827;stroke:#294865;stroke-width:2}.line{stroke:#67b9ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#526d88;stroke-width:2;stroke-dasharray:7 8;fill:none}.pill{fill:#0d2438;stroke:#315878;stroke-width:1.5}</style></defs><rect width="1500" height="880" rx="28" fill="url(#bg)"/><text x="70" y="68" class="t eyebrow">HARNESS OS · TRUEFORGE AGENT HARNESS ARCHITECTURE</text><text x="70" y="112" class="t h">TrueForge is the execution boundary. Harness OS is the evidence-driven control plane.</text><text x="70" y="144" class="muted s">Model inference → TrueForge runtime → deferred tools / sandbox / approval → external effects → evidence → Qodo / Safety Case</text>

<!-- model layer -->
<rect x="70" y="230" width="260" height="190" rx="22" class="box" filter="url(#shadow)"/><text x="100" y="270" class="t eyebrow">MODEL LAYER</text><text x="100" y="310" class="t h">LLM provider</text><text x="100" y="345" class="muted s">Local: Ollama</text><text x="100" y="372" class="muted s">Cloud: OpenAI-compatible provider</text><rect x="100" y="392" width="190" height="42" rx="12" class="pill"/><text x="195" y="418" text-anchor="middle" class="t s">Inference only</text>

<!-- trueforge central -->
<rect x="430" y="180" width="500" height="440" rx="30" fill="url(#tf)" stroke="#63b9ff" stroke-width="3" filter="url(#shadow)"/><text x="470" y="225" class="t eyebrow">SPONSOR RUNTIME · CENTRAL CONTROL</text><text x="470" y="270" class="t h">TrueForge</text><text x="470" y="305" class="muted s">Agent loop · session state · deferred tools · sandbox · approvals</text>
<rect x="470" y="345" width="190" height="95" rx="18" class="box"/><text x="495" y="378" class="t b">harness-os agent</text><text x="495" y="405" class="muted s">DISCOVER → ATTACK</text><text x="495" y="428" class="muted s">PROVE → REPAIR</text>
<rect x="700" y="345" width="190" height="95" rx="18" class="box"/><text x="725" y="378" class="t b">Dynamic subagents</text><text x="725" y="405" class="muted s">Discovery · Reliability</text><text x="725" y="428" class="muted s">Evidence · Remediation</text>
<rect x="470" y="475" width="190" height="95" rx="18" class="box"/><text x="495" y="508" class="t b">Sandbox</text><text x="495" y="535" class="muted s">Candidate fix verification</text><text x="495" y="558" class="muted s">before repository mutation</text>
<rect x="700" y="475" width="190" height="95" rx="18" class="box"/><text x="725" y="508" class="t b">Human approval</text><text x="725" y="535" class="muted s">Pause before consequential</text><text x="725" y="558" class="muted s">GitHub MCP actions</text>

<!-- tools -->
<rect x="1030" y="205" width="390" height="240" rx="24" class="box" filter="url(#shadow)"/><text x="1065" y="246" class="t eyebrow">DEFERRED MCP TOOLS</text><rect x="1065" y="278" width="145" height="120" rx="18" class="pill"/><text x="1138" y="315" text-anchor="middle" class="t b">GitHub MCP</text><text x="1138" y="344" text-anchor="middle" class="muted s">read repo</text><text x="1138" y="367" text-anchor="middle" class="muted s">branch · file · PR</text><rect x="1240" y="278" width="145" height="120" rx="18" class="pill"/><text x="1312" y="315" text-anchor="middle" class="t b">FaultLine</text><text x="1312" y="344" text-anchor="middle" class="muted s">timeout-after-success</text><text x="1312" y="367" text-anchor="middle" class="muted s">trace · effect state</text>

<!-- external effect -->
<rect x="1030" y="500" width="390" height="170" rx="24" class="box" filter="url(#shadow)"/><text x="1065" y="540" class="t eyebrow">EXTERNAL SIDE EFFECT</text><text x="1065" y="582" class="t h">Refund fixture</text><text x="1065" y="615" class="muted s">Authoritative state: ORD-1042 · $249 → $498</text><text x="1065" y="642" class="muted s">Two distinct committed refunds · no idempotency key</text>

<!-- harness os -->
<rect x="300" y="700" width="900" height="120" rx="24" class="box" filter="url(#shadow)"/><text x="340" y="740" class="t eyebrow">HARNESS OS CONTROL PLANE</text><text x="340" y="778" class="t b">Mission Control · Flight Recorder · H-005 evidence gates · approval scope · Safety Case</text><text x="340" y="805" class="muted s">Qodo reviews remediation PRs; release recommendation is scoped to tested evidence only.</text>

