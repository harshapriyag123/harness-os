<rect x="70" y="485" width="260" height="135" rx="20" class="pill"/><text x="100" y="520" class="t eyebrow">H-005 HERO FAULT</text><text x="100" y="555" class="t b">Remote SUCCESS</text><text x="100" y="582" class="muted s">response lost → caller TIMEOUT</text><text x="100" y="605" class="muted s">blind repeat can duplicate effect</text>
<path d="M330 550 C380 550 400 520 425 520" class="dash"/>

<text x="750" y="854" text-anchor="middle" class="muted s">CI proves code works. Harness OS proves the agent can be trusted when the real world behaves unexpectedly.</text></svg>